<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Word Processor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002b36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Writer">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fonts/mononoki-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --base03: #002b36;
            --base02: #073642;
            --base01: #586e75;
            --base00: #657b83;
            --base0: #839496;
            --base1: #93a1a1;
            --base2: #eee8d5;
            --base3: #fdf6e3;
            --yellow: #b58900;
            --orange: #cb4b16;
            --red: #dc322f;
            --magenta: #d33682;
            --violet: #6c71c4;
            --blue: #268bd2;
            --cyan: #2aa198;
            --green: #859900;
            --font-size: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'CustomFont', "Courier New", monospace;
            transition: background-color 0.2s, color 0.2s;
        }

        body.light-mode {
            background-color: var(--base3);
            color: var(--base00);
        }

        body.dark-mode {
            background-color: var(--base03);
            color: var(--base0);
        }

        /* ── Tab Bar ── */
        .tab-bar {
            display: flex;
            align-items: stretch;
            min-height: 40px;
            padding: 6px 8px 0 8px;
            gap: 2px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .tab-bar::-webkit-scrollbar { display: none; }

        .light-mode .tab-bar { background-color: var(--base2); }
        .dark-mode .tab-bar { background-color: var(--base02); }

        .tab {
            display: flex;
            align-items: center;
            font-family: inherit;
            font-size: 13px;
            padding: 6px 10px;
            border: none;
            cursor: pointer;
            opacity: 0.55;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }
        .tab.active { opacity: 1; }
        .tab.drag-over { border-bottom: 2px solid var(--blue); }

        .light-mode .tab { background-color: var(--base3); color: var(--base00); }
        .dark-mode .tab { background-color: var(--base03); color: var(--base0); }

        .close-button {
            margin-left: 8px;
            padding: 2px 5px;
            cursor: pointer;
            font-size: 13px;
            line-height: 13px;
            border-radius: 2px;
            transition: background-color 0.15s, color 0.15s;
        }
        .light-mode .close-button { background-color: var(--base2); color: var(--base01); }
        .dark-mode .close-button { background-color: var(--base02); color: var(--base1); }
        .close-button:hover { background-color: var(--red); color: var(--base3); }

        .new-tab-button {
            padding: 6px 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .new-tab-button:hover { opacity: 1; }
        .light-mode .new-tab-button { color: var(--base00); }
        .dark-mode .new-tab-button { color: var(--base0); }

        /* ── Title ── */
        .document-title {
            text-align: center;
            padding: 12px 10px 8px 10px;
            font-family: inherit;
            font-size: 15px;
            border: none;
            background: transparent;
            width: 60%;
            margin: 0 auto;
            display: block;
            outline: none;
            flex-shrink: 0;
        }
        .light-mode .document-title { color: var(--base00); }
        .dark-mode .document-title { color: var(--base0); }

        /* ── Editor ── */
        #editor {
            flex-grow: 1;
            width: 100%;
            font-family: inherit;
            font-size: var(--font-size);
            line-height: 1.6;
            border: none;
            outline: none;
            resize: none;
            padding: 0 5vw 60px 5vw;
            tab-size: 4;
        }
        .light-mode #editor { background-color: var(--base3); color: var(--base00); }
        .dark-mode #editor { background-color: var(--base03); color: var(--base0); }

        /* ── Status Bar ── */
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            padding: 4px 12px;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .light-mode #status-bar { color: var(--base01); background-color: var(--base2); }
        .dark-mode #status-bar { color: var(--base1); background-color: var(--base02); }

        #status-bar .left, #status-bar .center, #status-bar .right {
            flex: 1;
        }
        #status-bar .center { text-align: center; }
        #status-bar .right { text-align: right; }

        /* ── Toolbar (mobile) ── */
        .toolbar {
            display: none;
            padding: 6px 8px;
            gap: 4px;
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .light-mode .toolbar { background-color: var(--base2); }
        .dark-mode .toolbar { background-color: var(--base02); }

        .toolbar button {
            font-family: inherit;
            font-size: 12px;
            padding: 6px 10px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .light-mode .toolbar button { background-color: var(--base3); color: var(--base00); }
        .dark-mode .toolbar button { background-color: var(--base03); color: var(--base0); }

        /* ── Find/Replace Bar ── */
        .find-bar {
            display: none;
            padding: 8px 5vw;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .find-bar.visible { display: flex; }

        .light-mode .find-bar { background-color: var(--base2); }
        .dark-mode .find-bar { background-color: var(--base02); }

        .find-bar input {
            font-family: inherit;
            font-size: 13px;
            padding: 5px 8px;
            border: 1px solid var(--base01);
            outline: none;
            min-width: 0;
            flex: 1;
            max-width: 240px;
        }
        .light-mode .find-bar input { background-color: var(--base3); color: var(--base00); }
        .dark-mode .find-bar input { background-color: var(--base03); color: var(--base0); }

        .find-bar button {
            font-family: inherit;
            font-size: 12px;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .light-mode .find-bar button { background-color: var(--base3); color: var(--base00); }
        .dark-mode .find-bar button { background-color: var(--base03); color: var(--base0); }

        .find-bar .find-count {
            font-size: 11px;
            min-width: 50px;
        }
        .light-mode .find-bar .find-count { color: var(--base01); }
        .dark-mode .find-bar .find-count { color: var(--base1); }

        .find-bar .close-find {
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            background: transparent;
            border: none;
        }
        .light-mode .find-bar .close-find { color: var(--base01); }
        .dark-mode .find-bar .close-find { color: var(--base1); }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            padding: 20px;
            max-width: 360px;
            width: 90%;
            font-family: inherit;
        }
        .light-mode .modal { background-color: var(--base3); color: var(--base00); }
        .dark-mode .modal { background-color: var(--base03); color: var(--base0); }

        .modal h3 { margin-bottom: 10px; }
        .modal p { margin-bottom: 16px; font-size: 14px; }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-button {
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }
        .confirm-button { background-color: var(--red); color: var(--base3); }
        .light-mode .cancel-button { background-color: var(--base2); color: var(--base00); }
        .dark-mode .cancel-button { background-color: var(--base02); color: var(--base0); }

        /* ── Mode Toggle ── */
        #mode-toggle {
            position: fixed;
            z-index: 100;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .light-mode #mode-toggle { background-color: var(--base2); color: var(--base01); }
        .dark-mode #mode-toggle { background-color: var(--base02); color: var(--base1); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 13px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .light-mode .toast { background-color: var(--base02); color: var(--base1); }
        .dark-mode .toast { background-color: var(--base2); color: var(--base01); }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .tab { font-size: 12px; padding: 6px 8px; }
            .close-button { padding: 2px 4px; font-size: 12px; }
            .document-title { width: 85%; font-size: 14px; padding: 10px 10px 6px 10px; }
            #editor { padding: 0 4vw 80px 4vw; }
            #mode-toggle { top: auto; bottom: 40px; right: 8px; font-size: 11px; padding: 6px 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
            .toolbar { display: flex; }
            .find-bar input { max-width: 140px; }
        }

        /* ── Drop Zone ── */
        .drop-zone {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            font-size: 18px;
            pointer-events: none;
        }
        .drop-zone.visible { display: flex; }
        .light-mode .drop-zone { background-color: rgba(238, 232, 213, 0.92); color: var(--base01); }
        .dark-mode .drop-zone { background-color: rgba(0, 43, 54, 0.92); color: var(--base1); }

        /* ── Page View ── */
        body.page-view.light-mode { background-color: var(--base2); }
        body.page-view.dark-mode { background-color: var(--base02); }

        body.page-view #editor {
            max-width: var(--page-width, 816px);
            align-self: center;
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.12);
            padding-left: var(--page-margin, 96px);
            padding-right: var(--page-margin, 96px);
        }
        body.page-view.light-mode #editor { background-color: var(--base3); }
        body.page-view.dark-mode #editor { background-color: var(--base03); }

        /* ── Page Setup Modal ── */
        .page-setup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .page-setup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .page-setup-row select,
        .page-setup-row button {
            font-family: inherit;
            font-size: 12px;
            padding: 4px 10px;
            border: 1px solid var(--base01);
            cursor: pointer;
        }
        .light-mode .page-setup-row select,
        .light-mode .page-setup-row button { background-color: var(--base2); color: var(--base00); }
        .dark-mode .page-setup-row select,
        .dark-mode .page-setup-row button { background-color: var(--base02); color: var(--base0); }

        .page-setup-row button.active {
            background-color: var(--cyan);
            color: var(--base3);
            border-color: var(--cyan);
        }

        #status-right .page-setup-link {
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.15s;
            padding: 2px 6px;
        }
        #status-right .page-setup-link:hover { opacity: 1; }

        /* ── Print Content ── */
        .print-content { display: none; }

        @media print {
            .tab-bar, .toolbar, #status-bar, #mode-toggle, .find-bar,
            .modal-overlay, .page-setup-overlay, .toast, .drop-zone,
            .document-title, #editor { display: none !important; }

            body { background: white !important; }

            .print-content {
                display: block !important;
                white-space: pre-wrap;
                font-family: 'CustomFont', "Courier New", monospace;
                font-size: var(--font-size, 16px);
                line-height: 1.6;
                color: #000 !important;
                padding: 0;
                margin: 0;
            }
            .print-content .print-section {
                white-space: pre-wrap;
            }
            .print-content .print-page-break {
                page-break-before: always;
            }
        }

        @media (max-width: 768px) {
            body.page-view #editor {
                max-width: 100%;
                box-shadow: none;
                padding-left: var(--page-margin, 48px);
                padding-right: var(--page-margin, 48px);
            }
        }
    </style>
</head>
<body class="light-mode">

    <div class="tab-bar"></div>
    <input type="text" class="document-title" placeholder="untitled document">

    <div class="find-bar" id="find-bar">
        <input type="text" id="find-input" placeholder="Find...">
        <input type="text" id="replace-input" placeholder="Replace...">
        <span class="find-count" id="find-count"></span>
        <button id="find-prev">&#9650;</button>
        <button id="find-next">&#9660;</button>
        <button id="replace-one">Replace</button>
        <button id="replace-all">All</button>
        <button class="close-find" id="close-find">&times;</button>
    </div>

    <textarea id="editor" placeholder="Start typing here..."></textarea>

    <div class="toolbar">
        <button data-action="find">Find</button>
        <button data-action="save-file">Export</button>
        <button data-action="open-file">Open</button>
        <button data-action="font-up">A+</button>
        <button data-action="font-down">A-</button>
        <button data-action="page-setup">Page</button>
    </div>

    <div id="status-bar">
        <div class="left" id="status-left"></div>
        <div class="center" id="status-center"></div>
        <div class="right" id="status-right"><span class="page-setup-link" id="page-setup-btn">&#9634; page setup</span></div>
    </div>

    <button id="mode-toggle">dark</button>

    <div class="modal-overlay">
        <div class="modal">
            <h3>Close Tab</h3>
            <p>Are you sure you want to close this tab?</p>
            <div class="modal-buttons">
                <button class="modal-button cancel-button">Cancel</button>
                <button class="modal-button confirm-button">Close</button>
            </div>
        </div>
    </div>

    <div class="page-setup-overlay" id="page-setup-overlay">
        <div class="modal">
            <h3>Page Setup</h3>
            <div class="page-setup-row">
                <span>View as page</span>
                <button id="page-view-toggle">off</button>
            </div>
            <div class="page-setup-row">
                <span>Paper size</span>
                <select id="paper-size">
                    <option value="letter">Letter</option>
                    <option value="a4">A4</option>
                </select>
            </div>
            <div class="page-setup-row">
                <span>Margins</span>
                <select id="page-margins">
                    <option value="normal">Normal</option>
                    <option value="narrow">Narrow</option>
                    <option value="wide">Wide</option>
                </select>
            </div>
            <p style="margin-top:12px; font-size:11px; opacity:0.7;">Page setup: Ctrl + Shift + P<br>Insert page break: Shift + Enter<br>Print: Ctrl + P</p>
            <div class="modal-buttons" style="margin-top: 12px;">
                <button class="modal-button cancel-button" id="page-setup-done">Done</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="drop-zone" id="drop-zone">Drop file to open</div>
    <div class="print-content" id="print-content"></div>

    <input type="file" id="file-input" accept=".txt,.md,.text,.log,.csv,.json,.js,.html,.css,.py,.xml,.yaml,.yml,.ini,.cfg,.sh,.bat" style="display:none">

    <script>
        /* ══════════════════════════════════════
           State
        ══════════════════════════════════════ */
        let tabs = [];
        let activeTabId = null;
        let tabToClose = null;
        let cursorPositions = {};  // tabId -> { start, end, scrollTop }
        let undoStacks = {};       // tabId -> [{ content, cursor }]
        let redoStacks = {};       // tabId -> [{ content, cursor }]
        let dragTabId = null;

        const PAGE_BREAK_MARKER = '--- page break ---';
        const PAGE_SIZES = { letter: 816, a4: 794 };
        const PAGE_MARGINS = { normal: 96, narrow: 48, wide: 120 };

        const editor = document.getElementById('editor');
        const titleInput = document.querySelector('.document-title');
        const statusLeft = document.getElementById('status-left');
        const statusCenter = document.getElementById('status-center');
        const statusRight = document.getElementById('status-right');
        const modeToggle = document.getElementById('mode-toggle');
        const modalOverlay = document.querySelector('.modal-overlay');
        const confirmButton = document.querySelector('.confirm-button');
        const cancelButton = document.querySelector('.cancel-button');
        const toast = document.getElementById('toast');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const findBar = document.getElementById('find-bar');
        const findInput = document.getElementById('find-input');
        const replaceInput = document.getElementById('replace-input');
        const findCount = document.getElementById('find-count');
        const body = document.body;

        /* ══════════════════════════════════════
           Toast
        ══════════════════════════════════════ */
        let toastTimer;
        function showToast(msg) {
            clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        /* ══════════════════════════════════════
           Dark Mode
        ══════════════════════════════════════ */
        function setDarkMode(dark) {
            body.classList.toggle('light-mode', !dark);
            body.classList.toggle('dark-mode', dark);
            modeToggle.textContent = dark ? 'light' : 'dark';
            document.querySelector('meta[name="theme-color"]').content = dark ? '#002b36' : '#fdf6e3';
            localStorage.setItem('darkMode', dark);
        }

        modeToggle.addEventListener('click', () => {
            setDarkMode(body.classList.contains('light-mode'));
        });

        /* ══════════════════════════════════════
           Font Size
        ══════════════════════════════════════ */
        function changeFontSize(delta) {
            let size = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
            size = Math.min(32, Math.max(10, size + delta));
            document.documentElement.style.setProperty('--font-size', size + 'px');
            localStorage.setItem('fontSize', size);
            showToast(size + 'px');
        }

        /* ══════════════════════════════════════
           Page Setup
        ══════════════════════════════════════ */
        const pageSetupOverlay = document.getElementById('page-setup-overlay');
        const pageViewToggle = document.getElementById('page-view-toggle');
        const paperSizeSelect = document.getElementById('paper-size');
        const pageMarginsSelect = document.getElementById('page-margins');

        function openPageSetup() {
            pageSetupOverlay.style.display = 'flex';
        }

        function closePageSetup() {
            pageSetupOverlay.style.display = 'none';
            editor.focus();
        }

        function setPageView(on) {
            body.classList.toggle('page-view', on);
            pageViewToggle.textContent = on ? 'on' : 'off';
            pageViewToggle.classList.toggle('active', on);
            localStorage.setItem('pageView', on);
        }

        function applyPaperSize(size) {
            const width = PAGE_SIZES[size] || PAGE_SIZES.letter;
            document.documentElement.style.setProperty('--page-width', width + 'px');
            localStorage.setItem('paperSize', size);
        }

        function applyPageMargins(margins) {
            const px = PAGE_MARGINS[margins] || PAGE_MARGINS.normal;
            document.documentElement.style.setProperty('--page-margin', px + 'px');
            localStorage.setItem('pageMargins', margins);
        }

        function insertPageBreak() {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const insert = '\n' + PAGE_BREAK_MARKER + '\n';
            pushUndo();
            editor.value = text.substring(0, start) + insert + text.substring(end);
            editor.selectionStart = editor.selectionEnd = start + insert.length;
            editor.focus();
            saveCurrentTab();
            updateWordCount();
        }

        function printDocument() {
            saveCurrentTab();
            const content = editor.value;
            const printDiv = document.getElementById('print-content');
            const sections = content.split(PAGE_BREAK_MARKER);

            printDiv.innerHTML = '';
            sections.forEach((section, i) => {
                const div = document.createElement('div');
                div.className = 'print-section' + (i > 0 ? ' print-page-break' : '');
                div.textContent = section;
                printDiv.appendChild(div);
            });

            window.print();
        }

        document.getElementById('page-setup-btn').addEventListener('click', openPageSetup);
        document.getElementById('page-setup-done').addEventListener('click', closePageSetup);
        pageSetupOverlay.addEventListener('click', (e) => {
            if (e.target === pageSetupOverlay) closePageSetup();
        });

        pageViewToggle.addEventListener('click', () => {
            setPageView(!body.classList.contains('page-view'));
        });
        paperSizeSelect.addEventListener('change', () => applyPaperSize(paperSizeSelect.value));
        pageMarginsSelect.addEventListener('change', () => applyPageMargins(pageMarginsSelect.value));

        /* ══════════════════════════════════════
           Tabs
        ══════════════════════════════════════ */
        function createNewTab(title, content) {
            const newTab = {
                id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                title: title || '',
                content: content || '',
            };
            tabs.push(newTab);
            undoStacks[newTab.id] = [];
            redoStacks[newTab.id] = [];
            activeTabId = newTab.id;
            saveTabs();
            renderTabs();
            loadActiveTab();
            editor.focus();
        }

        function switchTab(tabId) {
            if (tabId === activeTabId) return;
            saveCursorPosition();
            saveCurrentTab();
            activeTabId = tabId;
            localStorage.setItem('activeTabId', tabId);
            loadActiveTab();
            restoreCursorPosition();
            renderTabs();
        }

        function saveCurrentTab() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.content = editor.value;
                tab.title = titleInput.value;
                saveTabs();
            }
        }

        function loadActiveTab() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                editor.value = tab.content || '';
                titleInput.value = tab.title || '';
                updateWordCount();
            }
        }

        function saveCursorPosition() {
            if (activeTabId) {
                cursorPositions[activeTabId] = {
                    start: editor.selectionStart,
                    end: editor.selectionEnd,
                    scrollTop: editor.scrollTop
                };
            }
        }

        function restoreCursorPosition() {
            const pos = cursorPositions[activeTabId];
            if (pos) {
                editor.selectionStart = pos.start;
                editor.selectionEnd = pos.end;
                editor.scrollTop = pos.scrollTop;
            }
        }

        function showCloseModal(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            // skip modal for empty tabs
            if (tab && !tab.content && !tab.title) {
                closeTab(tabId);
                return;
            }
            tabToClose = tabId;
            modalOverlay.style.display = 'flex';
        }

        function hideCloseModal() {
            modalOverlay.style.display = 'none';
            tabToClose = null;
        }

        function closeTab(tabId) {
            const index = tabs.findIndex(t => t.id === tabId);
            if (index === -1) return;
            delete cursorPositions[tabId];
            delete undoStacks[tabId];
            delete redoStacks[tabId];
            tabs.splice(index, 1);

            if (tabs.length === 0) {
                createNewTab();
            } else if (activeTabId === tabId) {
                activeTabId = tabs[Math.max(0, index - 1)].id;
            }
            saveTabs();
            renderTabs();
            loadActiveTab();
        }

        function cycleTab(direction) {
            if (tabs.length < 2) return;
            saveCursorPosition();
            saveCurrentTab();
            const idx = tabs.findIndex(t => t.id === activeTabId);
            const next = (idx + direction + tabs.length) % tabs.length;
            activeTabId = tabs[next].id;
            localStorage.setItem('activeTabId', activeTabId);
            loadActiveTab();
            restoreCursorPosition();
            renderTabs();
            // scroll active tab into view
            const activeEl = document.querySelector('.tab.active');
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }

        function renderTabs() {
            const tabBar = document.querySelector('.tab-bar');
            tabBar.innerHTML = '';

            tabs.forEach(tab => {
                const el = document.createElement('button');
                el.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                el.draggable = true;
                el.dataset.tabId = tab.id;

                const label = tab.title || `file${tabs.indexOf(tab) + 1}`;
                const textSpan = document.createElement('span');
                textSpan.textContent = label;
                el.appendChild(textSpan);

                el.addEventListener('click', () => switchTab(tab.id));

                // drag to reorder
                el.addEventListener('dragstart', (e) => {
                    dragTabId = tab.id;
                    e.dataTransfer.effectAllowed = 'move';
                });
                el.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    el.classList.add('drag-over');
                });
                el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
                el.addEventListener('drop', (e) => {
                    e.preventDefault();
                    el.classList.remove('drag-over');
                    if (dragTabId && dragTabId !== tab.id) {
                        const fromIdx = tabs.findIndex(t => t.id === dragTabId);
                        const toIdx = tabs.findIndex(t => t.id === tab.id);
                        const [moved] = tabs.splice(fromIdx, 1);
                        tabs.splice(toIdx, 0, moved);
                        saveTabs();
                        renderTabs();
                    }
                    dragTabId = null;
                });

                const closeBtn = document.createElement('span');
                closeBtn.textContent = '\u00d7';
                closeBtn.className = 'close-button';
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showCloseModal(tab.id);
                });
                el.appendChild(closeBtn);
                tabBar.appendChild(el);
            });

            const newBtn = document.createElement('button');
            newBtn.className = 'new-tab-button';
            newBtn.textContent = '+';
            newBtn.addEventListener('click', () => createNewTab());
            tabBar.appendChild(newBtn);
        }

        function saveTabs() {
            localStorage.setItem('tabs', JSON.stringify(tabs));
            localStorage.setItem('activeTabId', activeTabId);
        }

        /* ══════════════════════════════════════
           Undo / Redo (per-tab)
        ══════════════════════════════════════ */
        function pushUndo() {
            if (!activeTabId) return;
            if (!undoStacks[activeTabId]) undoStacks[activeTabId] = [];
            const stack = undoStacks[activeTabId];
            const snap = { content: editor.value, start: editor.selectionStart, end: editor.selectionEnd };
            // avoid duplicate tops
            if (stack.length > 0 && stack[stack.length - 1].content === snap.content) return;
            stack.push(snap);
            if (stack.length > 200) stack.shift();
            redoStacks[activeTabId] = [];
        }

        function doUndo() {
            const stack = undoStacks[activeTabId];
            if (!stack || stack.length === 0) return;
            if (!redoStacks[activeTabId]) redoStacks[activeTabId] = [];
            redoStacks[activeTabId].push({ content: editor.value, start: editor.selectionStart, end: editor.selectionEnd });
            const snap = stack.pop();
            editor.value = snap.content;
            editor.selectionStart = snap.start;
            editor.selectionEnd = snap.end;
            saveCurrentTab();
            updateWordCount();
        }

        function doRedo() {
            const stack = redoStacks[activeTabId];
            if (!stack || stack.length === 0) return;
            if (!undoStacks[activeTabId]) undoStacks[activeTabId] = [];
            undoStacks[activeTabId].push({ content: editor.value, start: editor.selectionStart, end: editor.selectionEnd });
            const snap = stack.pop();
            editor.value = snap.content;
            editor.selectionStart = snap.start;
            editor.selectionEnd = snap.end;
            saveCurrentTab();
            updateWordCount();
        }

        /* ══════════════════════════════════════
           Word Count
        ══════════════════════════════════════ */
        function updateWordCount() {
            const text = editor.value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            statusLeft.textContent = words + ' words \u00b7 ' + chars + ' chars';
        }

        /* ══════════════════════════════════════
           Find & Replace
        ══════════════════════════════════════ */
        let findMatches = [];
        let findIndex = -1;

        function openFind() {
            findBar.classList.add('visible');
            findInput.focus();
            findInput.select();
            doFind();
        }

        function closeFind() {
            findBar.classList.remove('visible');
            findMatches = [];
            findIndex = -1;
            findCount.textContent = '';
            editor.focus();
        }

        function doFind() {
            const query = findInput.value;
            findMatches = [];
            findIndex = -1;
            if (!query) { findCount.textContent = ''; return; }

            const text = editor.value.toLowerCase();
            const q = query.toLowerCase();
            let pos = 0;
            while ((pos = text.indexOf(q, pos)) !== -1) {
                findMatches.push(pos);
                pos += q.length;
            }
            findCount.textContent = findMatches.length ? findMatches.length + ' found' : 'no match';
            if (findMatches.length) navigateFind(0);
        }

        function navigateFind(direction) {
            if (!findMatches.length) return;
            findIndex = (findIndex + direction + findMatches.length) % findMatches.length;
            const pos = findMatches[findIndex];
            editor.focus();
            editor.selectionStart = pos;
            editor.selectionEnd = pos + findInput.value.length;
            // scroll to selection
            const linesBefore = editor.value.substring(0, pos).split('\n').length;
            const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 24;
            editor.scrollTop = (linesBefore - 3) * lineHeight;
            findCount.textContent = (findIndex + 1) + '/' + findMatches.length;
        }

        function replaceOne() {
            if (findIndex < 0 || !findMatches.length) return;
            pushUndo();
            const pos = findMatches[findIndex];
            const before = editor.value.substring(0, pos);
            const after = editor.value.substring(pos + findInput.value.length);
            editor.value = before + replaceInput.value + after;
            saveCurrentTab();
            doFind();
        }

        function replaceAll() {
            if (!findInput.value) return;
            pushUndo();
            const q = findInput.value;
            const r = replaceInput.value;
            // case-insensitive replace all
            const regex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            const count = (editor.value.match(regex) || []).length;
            editor.value = editor.value.replace(regex, r);
            saveCurrentTab();
            doFind();
            showToast('Replaced ' + count + ' occurrences');
        }

        findInput.addEventListener('input', doFind);
        document.getElementById('find-next').addEventListener('click', () => navigateFind(1));
        document.getElementById('find-prev').addEventListener('click', () => navigateFind(-1));
        document.getElementById('replace-one').addEventListener('click', replaceOne);
        document.getElementById('replace-all').addEventListener('click', replaceAll);
        document.getElementById('close-find').addEventListener('click', closeFind);

        findInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); navigateFind(1); }
            if (e.key === 'Escape') closeFind();
        });
        replaceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFind();
        });

        /* ══════════════════════════════════════
           File Export / Import
        ══════════════════════════════════════ */
        function exportFile() {
            saveCurrentTab();
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab) return;
            const name = (tab.title || 'untitled') + '.md';
            const blob = new Blob([tab.content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exported ' + name);
        }

        function openFile() {
            fileInput.click();
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            readFileIntoTab(file);
            fileInput.value = '';
        });

        function readFileIntoTab(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const name = file.name.replace(/\.[^.]+$/, '');
                createNewTab(name, e.target.result);
                showToast('Opened ' + file.name);
            };
            reader.readAsText(file);
        }

        /* ── Drag & drop files ── */
        let dragCounter = 0;
        document.addEventListener('dragenter', (e) => {
            if (e.dataTransfer.types.includes('Files')) {
                dragCounter++;
                dropZone.classList.add('visible');
            }
        });
        document.addEventListener('dragleave', (e) => {
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dropZone.classList.remove('visible');
            }
        });
        document.addEventListener('dragover', (e) => {
            if (e.dataTransfer.types.includes('Files')) e.preventDefault();
        });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('visible');
            const file = e.dataTransfer.files[0];
            if (file) readFileIntoTab(file);
        });

        /* ══════════════════════════════════════
           Toolbar (mobile)
        ══════════════════════════════════════ */
        document.querySelector('.toolbar').addEventListener('click', (e) => {
            const action = e.target.dataset.action;
            if (!action) return;
            switch (action) {
                case 'find': openFind(); break;
                case 'save-file': exportFile(); break;
                case 'open-file': openFile(); break;
                case 'font-up': changeFontSize(2); break;
                case 'font-down': changeFontSize(-2); break;
                case 'page-setup': openPageSetup(); break;
            }
        });

        /* ══════════════════════════════════════
           Keyboard Shortcuts
        ══════════════════════════════════════ */
        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;

            // Shift+Enter  insert page break
            if (e.shiftKey && e.key === 'Enter' && !mod && document.activeElement === editor) {
                e.preventDefault();
                insertPageBreak();
                return;
            }
            // Ctrl+Shift+P  open page setup
            if (mod && e.shiftKey && e.key === 'P') {
                e.preventDefault();
                openPageSetup();
                return;
            }
            // Ctrl+P  print
            if (mod && !e.shiftKey && e.key === 'p') {
                e.preventDefault();
                printDocument();
                return;
            }
            // Ctrl+S  save
            if (mod && e.key === 's') {
                e.preventDefault();
                saveCurrentTab();
                showToast('Saved');
                return;
            }
            // Ctrl+N  new tab
            if (mod && e.key === 'n') {
                e.preventDefault();
                createNewTab();
                return;
            }
            // Ctrl+W  close tab
            if (mod && e.key === 'w') {
                e.preventDefault();
                showCloseModal(activeTabId);
                return;
            }
            // Ctrl+Tab / Ctrl+Shift+Tab  cycle tabs
            if (mod && e.key === 'Tab') {
                e.preventDefault();
                cycleTab(e.shiftKey ? -1 : 1);
                return;
            }
            // Ctrl+F  find
            if (mod && e.key === 'f') {
                e.preventDefault();
                openFind();
                return;
            }
            // Ctrl+H  replace (also opens find bar)
            if (mod && e.key === 'h') {
                e.preventDefault();
                openFind();
                replaceInput.focus();
                return;
            }
            // Ctrl+E  export
            if (mod && e.key === 'e') {
                e.preventDefault();
                exportFile();
                return;
            }
            // Ctrl+O  open
            if (mod && e.key === 'o') {
                e.preventDefault();
                openFile();
                return;
            }
            // Ctrl+Plus/Minus  font size
            if (mod && (e.key === '=' || e.key === '+')) {
                e.preventDefault();
                changeFontSize(2);
                return;
            }
            if (mod && e.key === '-') {
                e.preventDefault();
                changeFontSize(-2);
                return;
            }
            // Ctrl+Z undo (custom per-tab)
            if (mod && !e.shiftKey && e.key === 'z') {
                e.preventDefault();
                doUndo();
                return;
            }
            // Ctrl+Shift+Z or Ctrl+Y redo
            if ((mod && e.shiftKey && e.key === 'z') || (mod && e.key === 'y')) {
                e.preventDefault();
                doRedo();
                return;
            }
            // Escape closes find bar or page setup
            if (e.key === 'Escape') {
                if (pageSetupOverlay.style.display === 'flex') { closePageSetup(); return; }
                if (findBar.classList.contains('visible')) { closeFind(); return; }
            }
        });

        /* ══════════════════════════════════════
           Editor events
        ══════════════════════════════════════ */
        let undoTimer;
        editor.addEventListener('beforeinput', () => {
            // snapshot before each edit for undo
            clearTimeout(undoTimer);
            undoTimer = setTimeout(() => pushUndo(), 0);
        });

        editor.addEventListener('input', () => {
            updateWordCount();
        });

        titleInput.addEventListener('input', () => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.title = titleInput.value;
                saveTabs();
                renderTabs();
            }
        });

        /* ══════════════════════════════════════
           Modal
        ══════════════════════════════════════ */
        confirmButton.addEventListener('click', () => {
            if (tabToClose) { closeTab(tabToClose); hideCloseModal(); }
        });
        cancelButton.addEventListener('click', hideCloseModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideCloseModal();
        });

        /* ══════════════════════════════════════
           Auto-save
        ══════════════════════════════════════ */
        let typingTimer;
        editor.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                saveCurrentTab();
                statusCenter.textContent = 'saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }, 800);
        });

        setInterval(() => {
            if (activeTabId) {
                saveCurrentTab();
                statusCenter.textContent = 'saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }, 10000);

        /* ══════════════════════════════════════
           Init
        ══════════════════════════════════════ */
        (function init() {
            // dark mode
            const dark = localStorage.getItem('darkMode');
            if (dark === 'true') setDarkMode(true);
            else if (dark === null && window.matchMedia('(prefers-color-scheme: dark)').matches) setDarkMode(true);

            // font size
            const savedSize = localStorage.getItem('fontSize');
            if (savedSize) document.documentElement.style.setProperty('--font-size', savedSize + 'px');

            // page setup
            if (localStorage.getItem('pageView') === 'true') setPageView(true);
            const savedPaper = localStorage.getItem('paperSize');
            if (savedPaper) { paperSizeSelect.value = savedPaper; applyPaperSize(savedPaper); }
            const savedMargins = localStorage.getItem('pageMargins');
            if (savedMargins) { pageMarginsSelect.value = savedMargins; applyPageMargins(savedMargins); }

            // tabs
            const saved = JSON.parse(localStorage.getItem('tabs') || '[]');
            if (saved.length === 0) {
                createNewTab();
            } else {
                tabs = saved;
                tabs.forEach(t => { undoStacks[t.id] = []; redoStacks[t.id] = []; });
                activeTabId = localStorage.getItem('activeTabId') || tabs[0].id;
                renderTabs();
                loadActiveTab();
            }
            updateWordCount();

            // register service worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        })();

        // prevent pinch zoom on mobile
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
